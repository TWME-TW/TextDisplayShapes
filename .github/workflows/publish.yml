name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: twme-repo-releases
          server-username: TWME_REPO_USERNAME
          server-password: TWME_REPO_PASSWORD

      - name: Build and publish
        run: mvn -B clean deploy
        env:
          TWME_REPO_USERNAME: ${{ secrets.TWME_REPO_USERNAME }}
          TWME_REPO_PASSWORD: ${{ secrets.TWME_REPO_PASSWORD }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          api/target/textdisplayshape-api-*.jar
          paper/target/textdisplayshape-paper-*.jar
          spigot/target/textdisplayshape-spigot-*.jar
          packet/target/textdisplayshape-packet-*.jar
          --title "TextDisplayShapes ${GITHUB_REF_NAME}"
          --generate-notes
